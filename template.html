<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wrapped Cards</title>
<!-- Render harness: render.js calls window.renderCards(customer), then screenshots every .card.
     Rebrand by editing the tokens below. Email clients strip web fonts, so all text is baked into the image. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #fff4ee; --bg2: #ffd9d2; --bg3: #f7b6c2;
  --ink: #5b2a86; --inkD: #46196e; --accent: #d1495b; --line: rgba(209, 73, 91, .25);
  --brand: "acme florals";
}
* { box-sizing: border-box }
body { margin: 0; background: #fff; font-family: "Fredoka", system-ui, sans-serif; -webkit-font-smoothing: antialiased }
#stage { display: flex; flex-wrap: wrap }
.card { width: 280px; aspect-ratio: 9 / 16; border-radius: 20px; overflow: hidden; position: relative;
  background: radial-gradient(120% 70% at 50% 0%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%) }
.card::before, .card::after { content: ""; position: absolute; border-radius: 50%; filter: blur(2px); opacity: .55 }
.card::before { width: 180px; height: 180px; left: -60px; bottom: -40px; background: radial-gradient(circle, #ffe08a, transparent 70%) }
.card::after { width: 220px; height: 220px; right: -90px; top: 90px; background: radial-gradient(circle, #ffffff, transparent 70%) }
.top { position: absolute; top: 22px; left: 0; right: 0; text-align: center; z-index: 1 }
.wordmark { font-weight: 700; font-size: 15px; letter-spacing: .02em; color: var(--ink) }
.wordmark span { color: var(--accent) }
.year { font-weight: 600; font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); margin-top: 3px }
.blooms { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 22px; letter-spacing: 6px; z-index: 1 }
.foot { position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; font-weight: 600; font-size: 10px; letter-spacing: .14em; color: var(--accent); z-index: 1 }
.inner { position: absolute; inset: 22% 0 24% 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 18px; text-align: center; z-index: 1 }
.emoji { font-size: 36px; line-height: 1; margin-bottom: 10px }
.intro { font-weight: 500; font-size: 13px; color: var(--accent); margin-bottom: 5px }
.name { font-weight: 700; font-size: 28px; line-height: 1.03; color: var(--ink); text-transform: uppercase; max-width: 250px }
.meaning { font-weight: 500; font-size: 13.5px; line-height: 1.34; color: var(--accent); margin-top: 12px; max-width: 236px }
.big { font-weight: 700; font-size: 46px; line-height: 1; color: var(--ink); text-wrap: balance }
.label { font-weight: 700; font-size: 16px; line-height: 1.2; color: var(--ink); margin-top: 11px; max-width: 222px; text-wrap: balance }
.sub { font-weight: 500; font-size: 13px; line-height: 1.32; color: var(--accent); margin-top: 8px; max-width: 222px; text-wrap: balance }
.sub b, .meaning b, .label b { color: var(--inkD); font-weight: 700 }
.sumkick { font-weight: 600; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent) }
.sumname { font-weight: 600; font-size: 15px; color: var(--ink); margin-top: 6px }
.sumarch { font-weight: 700; font-size: 20px; line-height: 1.06; color: var(--ink); text-transform: uppercase; margin-top: 4px; max-width: 220px }
.srows { width: 100%; max-width: 206px; margin: 13px auto 0; display: flex; flex-direction: column }
.srow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line) }
.srow .k { font-weight: 500; font-size: 9.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--accent); white-space: nowrap }
.srow .v { font-weight: 700; font-size: 11.5px; color: var(--ink); text-align: right; white-space: nowrap }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const BRAND = { name: "acme", rest: " florals", year: "Wrapped 2026", tag: "#ACMEWRAPPED", blooms: "🌷 🌸 🌻" };
const shell = (inner) => `<div class="card"><div class="top"><div class="wordmark">${BRAND.name}<span>${BRAND.rest}</span></div>
  <div class="year">${BRAND.year}</div></div><div class="inner">${inner}</div>
  <div class="foot">${BRAND.tag}</div><div class="blooms">${BRAND.blooms}</div></div>`;
const archeCard = (c) => shell(`<div class="emoji">${c.archetype.emoji}</div><div class="intro">You are…</div>
  <div class="name">${c.archetype.name}</div><div class="meaning">${c.archetype.meaning}</div>`);
const statCard = (s) => shell(`${s.emoji ? `<div class="emoji">${s.emoji}</div>` : ""}<div class="big">${s.big}</div>
  <div class="label">${s.label}</div><div class="sub">${s.sub}</div>`);
function summaryCard(c) {
  const get = (k) => (c.cards.find((x) => x.key === k) || {}).big;
  let rows = [["Gifts sent", c.orders]];
  if (get("spend")) rows.push(["Spent on love", get("spend") + (c.spend_pct <= 50 ? ` · top ${c.spend_pct}%` : "")]);
  if (get("best_year")) rows.push(["Best year", get("best_year")]);
  if (get("type")) rows.push(["Sending style", get("type").replace("<br>", " ")]);
  const rh = rows.slice(0, 4).map((r) => `<div class="srow"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join("");
  return shell(`<div class="sumkick">Your recap</div>${c.first_name ? `<div class="sumname">${c.first_name}, you are</div>` : ""}
    <div class="sumarch">${c.archetype.name}</div><div class="srows">${rh}</div>`);
}
// Returns the card keys in render order: archetype, ...stats, summary.
window.renderCards = (c) => {
  document.getElementById("stage").innerHTML = archeCard(c) + c.cards.map(statCard).join("") + summaryCard(c);
  return ["archetype", ...c.cards.map((x) => x.key), "summary"];
};
</script>
</body>
</html>
